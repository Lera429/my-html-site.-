<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чек-лист рабочего места — тест пройден (91/92)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f0f4fa;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 32px 20px;
      color: #1a2c3e;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 28px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
      padding: 24px 28px;
      margin-bottom: 24px;
      border: 1px solid #e2ecf5;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1f4ec9, #3a76ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .subhead {
      color: #4a627a;
      border-left: 4px solid #3a76ff;
      padding-left: 16px;
      margin: 12px 0 20px 0;
      font-weight: 500;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }

    .category {
      background: #fefefe;
      border-radius: 24px;
      border: 1px solid #e2edf8;
      padding: 18px 20px;
      transition: 0.1s;
    }

    .category h3 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #0c2b5e;
    }

    .cat-desc {
      font-size: 0.8rem;
      color: #6a7f9b;
      margin-bottom: 16px;
      border-bottom: 1px dashed #dce6f0;
      padding-bottom: 8px;
    }

    .check-item {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #ecf3fa;
    }

    .check-item p {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .radio-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .radio-group label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f6f9fe;
      padding: 5px 14px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid #dfe8f2;
      cursor: pointer;
    }

    input[type="radio"] {
      width: 17px;
      height: 17px;
      accent-color: #1f4ec9;
      cursor: pointer;
    }

    .result-panel {
      background: linear-gradient(115deg, #ecf3fd, #ffffff);
      border-radius: 28px;
      padding: 24px 28px;
      border: 1px solid #cfe0f2;
      margin-top: 16px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.7);
      padding: 18px 22px;
      border-radius: 28px;
      margin-bottom: 24px;
    }

    .stat-block {
      text-align: center;
      min-width: 100px;
    }

    .stat-number {
      font-size: 2.4rem;
      font-weight: 800;
      color: #1f4ec9;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #52677f;
    }

    .badge {
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 60px;
      display: inline-block;
    }

    .badge-green {
      background: #e0f7ec;
      color: #0f6e4a;
      border: 1px solid #b9e6d0;
    }

    textarea {
      width: 100%;
      border-radius: 20px;
      border: 1px solid #cbdde9;
      padding: 14px 18px;
      font-family: inherit;
      font-size: 0.9rem;
      background: #fff;
      resize: vertical;
    }

    .flex-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin: 20px 0;
    }

    button {
      background: #1f4ec9;
      border: none;
      padding: 11px 24px;
      border-radius: 40px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      font-family: inherit;
      margin-top: 12px;
      margin-right: 12px;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #1f4ec9;
      color: #1f4ec9;
    }

    hr {
      margin: 18px 0;
      border: none;
      border-top: 2px dotted #d4e2f5;
    }

    footer {
      font-size: 0.7rem;
      text-align: center;
      margin-top: 20px;
      color: #6f85a0;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>✅ Аудит рабочего места</h1>
    <div class="subhead">Тест пройден: везде 2 балла, кроме последнего пункта (1 балл). Итог — 91/92 (99%).</div>
  </div>

  <div id="categoriesRoot" class="grid-2"></div>

  <div class="result-panel">
    <div class="stats" id="statsBlock">
      <div class="stat-block"><div class="stat-number" id="totalVal">0</div><div class="stat-label">Набрано баллов</div></div>
      <div class="stat-block"><div class="stat-number" id="maxVal">0</div><div class="stat-label">Максимум</div></div>
      <div class="stat-block"><div class="stat-number" id="percentVal">0%</div><div class="stat-label">Процент</div></div>
      <div class="stat-block"><div id="verdictSpan" class="badge badge-green">Оценка</div></div>
    </div>

    <hr>

    <div class="flex-2">
      <div>
        <label style="font-weight:700;">✅ Три сильные стороны</label>
        <textarea id="strengthsField" rows="4">1. Идеальное соответствие задач и конфигурации — техника подобрана строго под реальные сценарии использования (аналитика, документооборот, программирование, видеосвязь). Отсутствуют лишние, неиспользуемые устройства.
2. Превосходная эргономика и организация пространства: монитор на комфортной высоте (верх на уровне глаз), правильное расстояние до экрана, удобное расположение клавиатуры и мыши. Провода аккуратно убраны, розетки расположены безопасно.
3. Высокая производительность и надёжность: достаточный объём оперативной памяти (соответствует многозадачной нагрузке), быстрый SSD-накопитель, эффективная система охлаждения без перегревов, возможность обслуживания и замены компонентов.</textarea>
      </div>
      <div>
        <label style="font-weight:700;">⚠️ Три проблемные зоны</label>
        <textarea id="problemsField" rows="4">1. Единственный системный недочёт — при закупке рабочего места не в полной мере учтена перспектива модернизации. Основной акцент сделан на стартовую цену, а не на долгосрочную гибкость конфигурации.
2. При масштабировании задач через 2-3 года (например, переход на более ресурсоёмкое ПО или увеличение объёма данных) может потребоваться частичное обновление компонентов, которое не было заложено в бюджет.
3. Отсутствует формализованный график планового обслуживания техники (регулярная чистка от пыли, проверка термоинтерфейсов, диагностика накопителей), что в перспективе может сократить срок службы оборудования.</textarea>
      </div>
    </div>

    <div style="margin-top: 6px;">
      <label style="font-weight:700;">🚀 Три улучшения с наибольшим эффектом</label>
      <textarea id="improvementsField" rows="4">1. Внедрить стратегический подход к закупкам: при формировании бюджета закладывать не только текущую цену, но и возможность будущего апгрейда (дополнительные слоты ОЗУ, запас по блоку питания, возможность установки второго накопителя).
2. Добавить второй монитор (или предусмотреть возможность его подключения) для повышения эффективности при работе с большим объёмом данных, таблицами и многозадачными сценариями.
3. Разработать и внедрить регламент ежегодного профилактического обслуживания: чистка системы охлаждения, замена термопасты, проверка состояния накопителей. Это продлит срок службы техники и сохранит производительность.</textarea>
    </div>

    <div>
      <button id="saveBtn">💾 Сохранить результаты</button>
      <button id="resetBtn" class="btn-outline">⟳ Сбросить (вернуть шаблон 91/92)</button>
    </div>
    <footer>Данные сохраняются в браузере автоматически. Вы можете редактировать текст полей.</footer>
  </div>
</div>

<script>
  // ---------- ДАННЫЕ ЧЕК-ЛИСТА (9 разделов) ----------
  const categoriesData = [
    { name: "1. Назначение рабочего места", desc: "Соответствует ли конфигурация реальным задачам пользователя.",
      items: [
        "Понятно, для каких задач предназначено рабочее место: учёба, документооборот, аналитика, проектная работа, графика, видеосвязь, программирование.",

    { name: "2. Пространство и компоновка", desc: "Насколько рационально организовано пространство и размещено оборудование.",
      items: [
        "Стол и рабочая поверхность достаточны по размеру для техники и комфортной работы.",
        "Оборудование размещено так, чтобы не мешать движениям и доступу к основным предметам.",
        "Провода не создают беспорядка, не мешают работе и не формируют опасных зон.",
        "Розетки, удлинители и блоки питания расположены безопасно и удобно.",
        "В рабочей зоне нет помех для вентиляции техники и свободного доступа к оборудованию."
      ] },
    { name: "3. Эргономика", desc: "Оценка посадки, положения монитора и условий длительной работы.",
      items: [
        "Высота стола и посадка позволяют работать без постоянного напряжения спины и плеч.",
        "Монитор расположен на комфортной высоте: верхняя часть экрана примерно на уровне глаз или немного ниже.",
        "Расстояние до экрана достаточное для устойчивой и ненапряжённой работы.",
        "Клавиатура и мышь размещены так, чтобы руки не были постоянно подняты или изогнуты.",
        "Освещение не создаёт сильных бликов на экране и не мешает восприятию изображения.",
        "Рабочее место допускает длительную работу без выраженного дискомфорта."
      ] },
    { name: "4. Экран и визуальная нагрузка", desc: "Соответствие монитора задачам и условиям восприятия.",
      items: [
        "Размер экрана соответствует задачам пользователя.",
        "Разрешение экрана достаточно для комфортной работы с документами, таблицами и интерфейсами.",
        "Яркость и качество изображения позволяют работать без избыточного напряжения зрения.",
        "Монитор установлен устойчиво и не занимает пространство нерационально.",
        "При необходимости предусмотрен второй экран или возможность его подключения."
      ] },
    { name: "5. Форм-фактор и тип техники", desc: "Насколько выбранная форма техники соответствует сценарию использования.",
      items: [
        "Форм-фактор устройства соответствует условиям использования: настольный ПК, ноутбук, моноблок, мини-ПК.",
        "Выбранная форма техники оправдана задачами, а не только внешним удобством.",
        "При необходимости модернизации выбран вариант, который допускает обслуживание и замену компонентов.",
        "Для стационарного рабочего места техника не теряет в удобстве из-за чрезмерной компактности.",
        "Для мобильной работы не используется избыточно громоздкая конфигурация."
      ] },
    { name: "6. Оперативная память", desc: "Соответствие ОЗУ реальной нагрузке рабочего места.",
      items: [
        "Объём оперативной памяти соответствует числу одновременно используемых программ.",
        "Конфигурация памяти подходит под рабочую нагрузку: браузер, документы, видеосвязь, аналитика, специализированные программы.",
        "Нет признаков того, что системе регулярно не хватает ОЗУ: зависания, медленное переключение между задачами, просадки при открытии файлов.",
        "Память подобрана не по минимальному порогу запуска системы, а по реальному сценарию работы.",
        "Для многозадачной среды предусмотрен разумный запас по ОЗУ."
      ] },
    { name: "7. Накопители данных", desc: "Оценка скорости, объёма и логики хранения данных.",
      items: [
        "Системный накопитель достаточно быстр для запуска операционной системы и приложений.",
        "Объём накопителя соответствует реальному объёму рабочих данных.",
        "Хранилище выбрано по задаче: скорость, ёмкость, надёжность, бюджет.",
        "В конфигурации учтено различие между рабочим накопителем и архивным хранением.",
        "При необходимости предусмотрена логика резервирования или внешнего хранения данных."
      ] },
    { name: "8. Надёжность, обслуживание, срок службы", desc: "Оценка устойчивости системы в реальной эксплуатации.",
      items: [
        "Техника не перегревается в условиях реального использования.",
        "Корпус, форм-фактор и размещение не затрудняют вентиляцию.",
        "Есть возможность очистки, обслуживания и замены ключевых компонентов.",
        "Компоновка не приводит к ускоренному износу техники из-за пыли, перегрева или вибраций.",
        "Рабочее место допускает безопасную и длительную эксплуатацию."
      ] },
    { name: "9. Логика закупки для организации", desc: "Оценка техники с точки зрения управленческого решения.",
      items: [
        "Конфигурация соответствует реальной категории сотрудников, а не усреднённому шаблону «для всех одинаково».",
        "Баланс между ценой и производительностью выглядит обоснованным.",
        "Нет явной переплаты за характеристики, которые не будут использоваться.",
        "Нет чрезмерной экономии на компонентах, влияющих на повседневную эффективность.",
        "Выбранная конфигурация подходит для массового обслуживания, эксплуатации и обновления.",
        "Закупка учитывает не только стартовую цену, но и удобство работы, срок службы и перспективу модернизации."
      ] }
  ];

  let maxPossible = 0;
  categoriesData.forEach(cat => { maxPossible += cat.items.length * 2; });

  function renderChecklistWithPreset() {
    const container = document.getElementById('categoriesRoot');
    container.innerHTML = '';
    categoriesData.forEach((cat, catIdx) => {
      const catDiv = document.createElement('div');
      catDiv.className = 'category';
      catDiv.innerHTML = `<h3>${cat.name}</h3><div class="cat-desc">${cat.desc}</div><div class="items-wrapper"></div>`;
      const wrapper = catDiv.querySelector('.items-wrapper');
      cat.items.forEach((itemText, itemIdx) => {
        const groupName = `cat_${catIdx}_item_${itemIdx}`;
        const isLastSpecial = (catIdx === 8 && itemIdx === cat.items.length - 1);
        const defaultVal = isLastSpecial ? 1 : 2;

        const itemDiv = document.createElement('div');
        itemDiv.className = 'check-item';
        itemDiv.innerHTML = `
          <p>${itemText}</p>
          <div class="radio-group" data-group="${groupName}">
            <label><input type="radio" name="${groupName}" value="0"> 0 (нет)</label>
            <label><input type="radio" name="${groupName}" value="1"> 1 (частично)</label>
            <label><input type="radio" name="${groupName}" value="2"> 2 (да)</label>
          </div>
        `;
        wrapper.appendChild(itemDiv);
        const radioToCheck = itemDiv.querySelector(`input[value="${defaultVal}"]`);
        if (radioToCheck) radioToCheck.checked = true;
      });
      container.appendChild(catDiv);
    });
    attachEvents();
    updateTotalsAndVerdict();
    autoSaveToLocal();
  }

  function attachEvents() {
    const allRadios = document.querySelectorAll('input[type="radio"]');
    allRadios.forEach(radio => {
      radio.removeEventListener('change', handleAnyChange);
      radio.addEventListener('change', handleAnyChange);
    });
    ['strengthsField', 'problemsField', 'improvementsField'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.removeEventListener('input', autoSaveToLocal);
      if (el) el.addEventListener('input', autoSaveToLocal);
    });
  }

  function handleAnyChange() {
    updateTotalsAndVerdict();
    autoSaveToLocal();
  }

  function computeScore() {
    let sum = 0;
    const allChecked = document.querySelectorAll('input[type="radio"]:checked');
    allChecked.forEach(radio => sum += parseInt(radio.value, 10));
    return sum;
  }

  function updateTotalsAndVerdict() {
    const current = computeScore();
    const percent = Math.round((current / maxPossible) * 100);
    document.getElementById('totalVal').innerText = current;
    document.getElementById('maxVal').innerText = maxPossible;
    document.getElementById('percentVal').innerText = percent + '%';

    let text = '';
    if (percent >= 85) text = '🏆 Рабочее место организовано грамотно и соответствует задачам';
    else if (percent >= 65) text = '👍 Хорошая организация, есть точки для улучшения';
    else if (percent >= 45) text = '⚠️ Место функционально, но заметны ограничения';
    else if (percent >= 25) text = '⚠️ Базовая пригодность, много слабых мест';
    else text = '❌ Требуется серьёзная переработка';
    document.getElementById('verdictSpan').innerText = text;
  }

  function autoSaveToLocal() {
    const checkedState = {};
    document.querySelectorAll('input[type="radio"]:checked').forEach(radio => {
      checkedState[radio.name] = radio.value;
    });
    const data = {
      radioChecked: checkedState,
      strengths: document.getElementById('strengthsField').value,
      problems: document.getElementById('problemsField').value,
      improvements: document.getElementById('improvementsField').value,
    };
    localStorage.setItem('workspace_prefilled_91', JSON.stringify(data));
  }

  function restoreFromLocal() {
    const raw = localStorage.getItem('workspace_prefilled_91');
    if (!raw) return;
    try {
      const saved = JSON.parse(raw);
      if (saved.radioChecked) {
        for (const [name, val] of Object.entries(saved.radioChecked)) {
          const target = document.querySelector(`input[name="${name}"][value="${val}"]`);
          if (target) target.checked = true;
        }
      }
      if (saved.strengths !== undefined) document.getElementById('strengthsField').value = saved.strengths;
      if (saved.problems !== undefined) document.getElementById('problemsField').value = saved.problems;
      if (saved.improvements !== undefined) document.getElementById('improvementsField').value = saved.improvements;
      updateTotalsAndVerdict();
    } catch(e) {}
  }

  function resetToOriginalPreset() {
    const allGroups = document.querySelectorAll('.radio-group');
    categoriesData.forEach((cat, catIdx) => {
      cat.items.forEach((_, itemIdx) => {
        const groupName = `cat_${catIdx}_item_${itemIdx}`;
        const isLastSpecial = (catIdx === 8 && itemIdx === cat.items.length - 1);
        const targetValue = isLastSpecial ? 1 : 2;
        const radioToSelect = document.querySelector(`input[name="${groupName}"][value="${targetValue}"]`);
        if (radioToSelect) radioToSelect.checked = true;
      });
    });
    // Заполняем поля текстом (уже заполнены в HTML, но на всякий случай дублируем)
